# Render Blueprint: on render.com choose New -> Blueprint and pick this GitHub repo.
services:
  - type: web
    name: campus-eco-sorter
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # keep PyTorch to one thread so it fits in the free plan's memory
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
