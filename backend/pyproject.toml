# Dependencies for the Vercel "api" service (see ../vercel.json).
# Runs the model with onnxruntime (~60 MB) instead of PyTorch (~860 MB, over Vercel's 500 MB limit).
# Create backend/model/mobilenetv3_waste.onnx first with export_onnx.bat.
# run.bat and Render use requirements-local.txt (PyTorch) instead.
[project]
name = "campus-eco-sorter-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "onnxruntime>=1.18",
]
